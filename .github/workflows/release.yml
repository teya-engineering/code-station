name: Release

# Publishes a signed and notarized DMG whenever you push a v* tag.
#   git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']
  # Run it again from the same tag, for a build that failed on something
  # transient. Pick the tag in the ref dropdown; there is nothing to type.
  workflow_dispatch:

jobs:
  # Being on main is not the same as passing on main: a merge can still break
  # the build. This waits for the Tests run from the push to main of the commit
  # being released, and stops the release unless it passed. It runs on Linux,
  # without the release environment, so waiting holds neither a Mac nor the
  # signing secrets.
  tested:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    # Long enough for a Tests run that has only just started.
    timeout-minutes: 45
    steps:
      - name: Wait for the Tests workflow to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/tests.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main"
          started=$SECONDS
          while :; do
            found="$(gh api "$runs")"
            passed="$(jq -r '[.workflow_runs[] | select(.conclusion == "success")][0].html_url // empty' <<<"$found")"
            if [ -n "$passed" ]; then
              echo "Tests passed on $GITHUB_SHA: $passed"
              exit 0
            fi
            pending="$(jq -r '[.workflow_runs[] | select(.status != "completed")][0].html_url // empty' <<<"$found")"
            seen="$(jq -r '[.workflow_runs[].conclusion // empty] | join(", ")' <<<"$found")"
            if [ -n "$pending" ]; then
              echo "Waiting for $pending"
            elif [ -z "$seen" ] && [ $((SECONDS - started)) -lt 180 ]; then
              # A tag pushed right after the merge can arrive before GitHub
              # has created the Tests run for it.
              echo "No Tests run for $GITHUB_SHA yet"
            else
              echo "::error::Tests have not passed on $GITHUB_SHA (runs from a push to main: ${seen:-none})." \
                "Release a commit whose Tests run passed. If its run was cancelled or failed for a" \
                "temporary reason, re-run that Tests run, then re-run this workflow from the tag."
              exit 1
            fi
            sleep 30
          done

  release:
    runs-on: macos-26
    # The signing secrets live in the release environment, so the job has to
    # declare it. Without this the secrets.* are empty and the certificate
    # import fails.
    environment: release
    # Nothing here starts, and no reviewer is asked to approve the release
    # environment, until the tested job has seen Tests pass on this commit.
    needs: tested
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The job's token has contents: write. Left in .git/config it would be
          # readable by everything else that runs here, and nothing needs it.
          persist-credentials: false

      # The version always comes from the ref, so the tag and the commit being
      # built cannot name different things.
      - name: Work out the version
        id: v
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::run this from a v* tag, not from a branch"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z]+)*$ ]]; then
            echo "::error::not a version: $version"
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      # A tag says nothing about the commit it points at, so a v* tag on an
      # unmerged branch would otherwise reach the signing key without ever
      # having been reviewed. Runs before any secret touches the runner.
      - name: Refuse to release a commit that is not on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_REF_NAME" --jq .status)"
          case "$status" in
            behind|identical) echo "$GITHUB_REF_NAME is on main" ;;
            *) echo "::error::$GITHUB_REF_NAME is not on main (compare says '$status'); merge it first"
               exit 1 ;;
          esac

      # macos-26 ships Xcode 26.x (Swift 6.3) by default - the same toolchain as
      # local development; on macos-15 (Swift 6.1) strict concurrency rejects
      # code that 6.3 accepts. If you ever need to pin the version, uncomment
      # the maxim-lobanov/setup-xcode step.
      # - uses: maxim-lobanov/setup-xcode@v1
      #   with:
      #     xcode-version: '16.4'
      - name: Toolchain
        run: swift --version && xcodebuild -version

      # Resolving here rather than during the build keeps dependency manifests,
      # which SwiftPM compiles and runs, away from the loaded signing key.
      - name: Resolve dependencies
        run: swift package resolve

      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this codesign stops to ask for the password in a UI that
          # does not exist.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write the App Store Connect API key
        env:
          AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$AC_API_KEY_P8" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey.p8"

      - name: Build, sign, notarize, package
        env:
          AC_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey.p8
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          TEAM_ID: QZG8V8U2Y6
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.v.outputs.version }}
        run: ./Scripts/release.sh "$VERSION"

      - name: Clean the secrets off the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/build.keychain-db"

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # No target_commitish: the tag already exists by now, and GitHub
          # discards it in that case rather than moving the tag.
          tag_name: v${{ steps.v.outputs.version }}
          name: Teya Code Station ${{ steps.v.outputs.version }}
          draft: true          # review it before making it public
          generate_release_notes: true
          files: |
            build/TeyaCodeStation-${{ steps.v.outputs.version }}.dmg
            build/TeyaCodeStation-${{ steps.v.outputs.version }}.dmg.sha256
