<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Conductor session</title>
  <style>
    /* The palette is the Mac app's own, so the phone reads as the same program seen
       narrow. Sizes are the 300px-wide design scaled by 1.3 for a ~390px viewport. */
    :root {
      color-scheme: light dark;
      --ink: #1c1b16;
      --canvas: #F5F3ED;
      --card: #FFFDF6;
      --hairline: rgba(117, 107, 87, .08);
      --hairline-strong: rgba(117, 107, 87, .14);
      --sunken: rgba(26, 26, 21, .035);
      --field: rgba(26, 26, 21, .05);
      /* The bare marks - a meter's track, the sheet's handle - that carry no fill of
         their own and only read as a groove in the surface. */
      --groove: rgba(26, 26, 21, .1);
      --muted: rgba(28, 27, 22, .62);
      --faint: rgba(28, 27, 22, .5);
      --green: #3E7A46;
      --green-deep: #2F4A33;
      --green-add: #2F6B3A;
      --amber: #C98B1E;
      --amber-text: #8A5D10;
      --amber-line: rgba(201, 139, 30, .5);
      --red: #A33D30;
      --primary: rgba(0, 0, 0, .9);
      --primary-text: #fff;
      --bubble: #E6E9C8;
      --bubble-line: rgba(120, 128, 50, .3);
      --serif: 'New York', 'Iowan Old Style', Palatino, Georgia, serif;
      --sans: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    /* The same tokens as the Mac app wears after dark. The design is drawn light; this is
       its counterpart rather than a second design. */
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2eee4;
        --canvas: #151513;
        --card: #201F1D;
        --hairline: rgba(255, 250, 239, .09);
        --hairline-strong: rgba(255, 250, 239, .14);
        --sunken: rgba(255, 255, 255, .035);
        --field: rgba(255, 255, 255, .05);
        --groove: rgba(255, 255, 255, .13);
        --muted: rgba(242, 238, 228, .62);
        --faint: rgba(242, 238, 228, .5);
        --green: #94C299;
        --green-deep: #94C299;
        --green-add: #9CC46A;
        --amber: #E6B85C;
        --amber-text: #E6B85C;
        --amber-line: rgba(230, 184, 92, .5);
        --red: #D96359;
        --primary: #f2eee4;
        --primary-text: #151513;
        --bubble: #2E3221;
        --bubble-line: rgba(160, 172, 90, .32);
      }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }

    * { box-sizing: border-box; }
    /* Several of the rows below are flex, which would otherwise draw over `hidden`. */
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }

    /* Everything the ask rises over. Dimming the pane rather than laying a scrim on top
       keeps the two lines above the sheet readable as the context they are. */
    #session {
      display: flex;
      flex: 1;
      flex-direction: column;
      min-height: 0;
      transition: opacity .25s ease-out;
    }
    body.asking #session { opacity: .32; }

    header {
      display: flex;
      flex: none;
      align-items: center;
      gap: 12px;
      height: calc(65px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      border-bottom: 1px solid var(--hairline);
      background: var(--card);
    }
    .head-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 1px; }
    #title {
      overflow: hidden;
      font: 600 19px/1.2 var(--serif);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #where {
      overflow: hidden;
      color: var(--faint);
      font: 11px var(--mono);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    #light {
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: var(--faint);
    }
    #light.running { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
    #light.attention { background: var(--amber); }

    #strip {
      display: flex;
      flex: none;
      align-items: center;
      gap: 12px;
      height: 36px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(117, 107, 87, .06);
      background: var(--sunken);
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: .5px;
    }
    #state { flex: none; font-weight: 600; color: var(--green-deep); }
    #state.attention { color: var(--amber-text); }
    #state.quiet { color: var(--muted); }
    #diff { display: flex; flex: none; gap: 5px; font-weight: 600; }
    #diff .added { color: var(--green-add); }
    #diff .removed { color: var(--red); }
    #failure {
      overflow: hidden;
      flex: 1;
      color: var(--red);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .strip-gap { flex: 1; }
    #context { display: flex; flex: none; align-items: center; gap: 9px; }
    .meter { width: 44px; height: 4px; overflow: hidden; border-radius: 3px; background: var(--groove); }
    .meter span { display: block; height: 100%; background: var(--green); }
    /* Stopping the turn is not part of the strip's grammar, so it sits at its end as one
       small red word rather than as a control. */
    #stop { flex: none; padding: 0; border: 0; background: none; color: var(--red);
            font: 600 11px var(--mono); letter-spacing: .5px; }

    #transcript {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 13px;
      padding: 16px;
      overflow-y: auto;
      background: var(--card);
      -webkit-overflow-scrolling: touch;
    }
    .message { display: flex; flex-direction: column; gap: 13px; }
    .notice, .empty {
      color: var(--faint);
      font: 11px var(--mono);
      letter-spacing: .5px;
      text-align: center;
    }
    .empty { padding: 60px 20px; font-family: var(--sans); font-size: 14px; letter-spacing: 0; }

    .bubble {
      max-width: 73%;
      align-self: flex-end;
      padding: 10px 14px;
      border: 1px solid var(--bubble-line);
      border-radius: 14px 14px 5px 14px;
      background: var(--bubble);
      font-size: 15.5px;
      line-height: 1.45;
    }
    .prose { font-size: 15.5px; line-height: 1.5; }
    .prose, .bubble, .thinking, pre { overflow-wrap: anywhere; white-space: pre-wrap; }
    .system .prose, .instructions .prose { color: var(--muted); font-size: 14px; }
    .thinking {
      padding-left: 11px;
      border-left: 2px solid var(--hairline-strong);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .attachment {
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--field);
      color: var(--muted);
      font: 12px var(--mono);
    }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      margin-left: 3px;
      background: var(--ink);
      vertical-align: text-bottom;
      animation: pulse 1.1s ease-in-out infinite;
    }

    .tool { border: 1px solid rgba(117, 107, 87, .1); border-radius: 10px; background: rgba(26, 26, 21, .04); }
    .tool-row {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      background: none;
      font: 12.5px var(--mono);
      color: var(--muted);
      text-align: left;
    }
    .tool-glyph { flex: none; font-weight: 700; color: var(--green-add); }
    .tool.running .tool-glyph { color: var(--muted); animation: pulse 1.6s ease-in-out infinite; }
    .tool.error .tool-glyph { color: var(--red); }
    .tool-name { flex: none; font-weight: 600; color: var(--ink); }
    .tool-argument { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tool-added { flex: none; margin-left: auto; padding-left: 9px; font-weight: 600; color: var(--green-add); }
    .tool-body { padding: 0 12px 12px; }
    .tool-label { margin: 9px 0 5px; color: var(--faint); font: 700 10px var(--mono); letter-spacing: .9px; }
    .tool-body pre {
      max-height: 300px;
      margin: 0;
      overflow: auto;
      padding: 10px;
      border-radius: 8px;
      background: var(--card);
      font: 12px/1.45 var(--mono);
    }

    #composer {
      display: flex;
      flex: none;
      align-items: center;
      gap: 10px;
      padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--hairline);
      background: var(--card);
    }
    #prompt {
      min-height: 47px;
      max-height: 140px;
      flex: 1;
      resize: none;
      padding: 13px 18px;
      border: 1px solid var(--hairline-strong);
      border-radius: 24px;
      outline: none;
      background: var(--field);
      font-size: 15.5px;
      line-height: 1.35;
    }
    #prompt::placeholder { color: rgba(28, 27, 22, .45); }
    @media (prefers-color-scheme: dark) { #prompt::placeholder { color: rgba(242, 238, 228, .45); } }
    #send {
      display: flex;
      width: 47px;
      height: 47px;
      flex: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 19px;
    }
    button:disabled { opacity: .4; cursor: default; }

    /* What catches the tap on the dimmed conversation. The pane behind it is context to
       read, not something to work in, so nothing under here is reachable while it is up. */
    #scrim { position: fixed; inset: 0; z-index: 4; }

    /* The ask. It is anchored to the foot of the same screen rather than a page of its
       own, so answering it never costs the reader their place in the conversation. */
    #sheet {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: flex;
      max-height: 88%;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 18px 21px calc(18px + env(safe-area-inset-bottom));
      border-top: 1.8px solid var(--amber-line);
      border-radius: 23px 23px 0 0;
      background: var(--card);
      box-shadow: 0 -18px 52px rgba(28, 25, 15, .18);
      animation: rise .25s ease-out;
    }
    #handle {
      width: 44px;
      height: 5px;
      flex: none;
      align-self: center;
      border-radius: 3px;
      background: var(--groove);
      /* The strip you grab is thin, so the reach around it is widened rather than the
         mark itself. */
      box-shadow: 0 -14px 0 0 transparent, 0 14px 0 0 transparent;
      touch-action: none;
    }
    .kind { display: flex; align-items: center; gap: 9px; }
    .kind-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .kind-label { color: var(--amber-text); font: 600 11.5px var(--mono); letter-spacing: 1.4px; }
    .lead { font-size: 17px; font-weight: 600; }
    .detail { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .subject {
      max-height: 220px;
      margin: 0;
      overflow: auto;
      padding: 12px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      background: var(--field);
      font: 14px/1.4 var(--mono);
    }
    .runs-in { color: var(--faint); font: 11.5px var(--mono); letter-spacing: .5px; }
    .buttons { display: flex; gap: 10px; }
    .buttons button { height: 52px; border-radius: 13px; font-size: 16px; font-weight: 600; }
    .deny { flex: 1; border: 1px solid rgba(163, 61, 48, .4); background: none; color: var(--red); }
    .allow { flex: 1.4; border: 0; background: var(--primary); color: var(--primary-text); }
    .always {
      padding: 0;
      border: 0;
      background: none;
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    /* Denying is the start of an answer rather than the whole of it, so the sheet stays
       and turns into the field where the reason gets typed. */
    .reason { display: flex; align-items: center; gap: 10px; }
    .reason textarea {
      min-height: 47px;
      max-height: 120px;
      flex: 1;
      resize: none;
      padding: 13px 18px;
      border: 1px solid var(--hairline-strong);
      border-radius: 24px;
      outline: none;
      background: var(--field);
      font-size: 15.5px;
      line-height: 1.35;
    }
    .reason button {
      width: 47px;
      height: 47px;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 19px;
    }

    .question-text { font-size: 17px; font-weight: 600; }
    .option {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--hairline-strong);
      border-radius: 12px;
      background: var(--field);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
    }
    .option.chosen { border-color: var(--green); background: rgba(62, 122, 70, .1); color: var(--green-deep); }
    .option-description { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .other {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--hairline-strong);
      border-radius: 12px;
      outline: none;
      background: var(--field);
      font-size: 15px;
    }

    /* The ask folded away. It keeps the amber and stays answerable, so putting the sheet
       down is not the same as ignoring it. */
    #bar {
      display: flex;
      flex: none;
      align-items: center;
      gap: 9px;
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-top: 1px solid var(--amber-line);
      background: rgba(201, 139, 30, .12);
      color: var(--amber-text);
      font: 600 11.5px var(--mono);
      letter-spacing: 1.4px;
      text-align: left;
    }
    #bar .strip-gap { letter-spacing: 0; }
    #bar .open { font-weight: 600; letter-spacing: .5px; }

    #toast {
      position: fixed;
      z-index: 10;
      top: calc(14px + env(safe-area-inset-top));
      right: 16px;
      left: 16px;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      font-size: 14px;
      transform: translateY(-160%);
      transition: transform .2s ease-out;
    }
    #toast.visible { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="toast" role="alert"></div>
  <div id="session">
    <header>
      <div class="head-copy">
        <div id="title">Connecting…</div>
        <div id="where">Teya Conductor</div>
      </div>
      <span id="light" aria-label="Disconnected"></span>
    </header>
    <div id="strip">
      <span id="state" class="quiet">CONNECTING</span>
      <span id="diff" hidden></span>
      <span id="failure" hidden></span>
      <span class="strip-gap"></span>
      <button id="stop" type="button" hidden>STOP</button>
      <span id="context" hidden>CTX<span class="meter"><span id="meter-fill"></span></span></span>
    </div>
    <main id="transcript"><div class="empty">Connecting to the session on your Mac…</div></main>
    <button id="bar" type="button" hidden></button>
    <form id="composer">
      <textarea id="prompt" maxlength="100000" placeholder="Nudge the session…"
                aria-label="Nudge the session"></textarea>
      <button id="send" type="submit" aria-label="Send prompt">↑</button>
    </form>
  </div>
  <script>
    (() => {
      const pairingID = location.pathname.split('/').filter(Boolean).pop();
      const fragment = new URLSearchParams(location.hash.slice(1));
      const storageKey = `conductor-pairing-${pairingID}`;
      const scannedSecret = fragment.get('secret');
      if (scannedSecret) sessionStorage.setItem(storageKey, scannedSecret);
      const secret = scannedSecret || sessionStorage.getItem(storageKey);
      if (location.hash) history.replaceState(null, '', location.pathname);

      const find = id => document.querySelector(`#${id}`);
      const light = find('light');
      const title = find('title');
      const where = find('where');
      const state = find('state');
      const diff = find('diff');
      const failure = find('failure');
      const context = find('context');
      const meterFill = find('meter-fill');
      const stop = find('stop');
      const transcript = find('transcript');
      const bar = find('bar');
      const composer = find('composer');
      const prompt = find('prompt');
      const sendButton = find('send');
      const toast = find('toast');
      let socket;
      let reconnectTimer;
      let toastTimer;
      let sheet;
      let scrim;
      let ask;
      // Whether the ask has been put down. It survives an update to the ask itself, so a
      // sheet folded away does not spring back up when a tool result lands behind it.
      let collapsed = false;
      let denying = false;
      const answerState = new Map();
      const expandedTools = new Set();
      // The transcript this phone has drawn, so an update only has to carry what moved.
      const model = new Map();
      const nodes = new Map();
      let order = [];
      let header = {};

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const button = (className, text, handler) => {
        const node = element('button', className, text);
        node.type = 'button';
        node.addEventListener('click', handler);
        return node;
      };

      const showError = message => {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 4500);
      };

      const send = command => {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          showError('The Mac is not connected.');
          return false;
        }
        socket.send(JSON.stringify(command));
        return true;
      };

      const setConnected = live => {
        light.setAttribute('aria-label', live ? 'Connected' : 'Disconnected');
        sendButton.disabled = !live;
        if (!live) light.className = '';
      };

      // MARK: - Status strip

      // "4M" while a turn runs, counting from when it was asked for; "2H" otherwise,
      // counting from the last thing that happened. Both are drawn here rather than sent,
      // so an idle session costs nothing to keep current.
      const elapsed = () => {
        if (!header.since) return '';
        const seconds = Math.max(0, (Date.now() - Date.parse(header.since)) / 1000);
        if (header.state === 'RUNNING') {
          if (seconds < 60) return `${Math.floor(seconds)}S`;
          if (seconds < 3600) return `${Math.floor(seconds / 60)}M`;
          if (seconds < 86400) return `${Math.floor(seconds / 3600)}H`;
          return `${Math.floor(seconds / 86400)}D`;
        }
        if (seconds < 60) return 'NOW';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}M`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}H`;
        if (seconds < 604800) return `${Math.floor(seconds / 86400)}D`;
        return `${Math.floor(seconds / 604800)}W`;
      };

      const renderElapsed = () => {
        if (!header.state) return;
        const queued = header.queuedPrompts ? ` · ${header.queuedPrompts} QUEUED` : '';
        state.textContent = `${header.state} · ${elapsed()}${queued}`;
      };

      const renderHeader = next => {
        header = next;
        title.textContent = next.title;
        where.textContent = next.branch ? `${next.project} · ${next.branch}`
                                        : `${next.project} · ${next.agent}`;
        document.title = `${next.title} · Conductor`;

        const running = next.state === 'RUNNING';
        light.className = running ? 'running' : next.state === 'IDLE' ? '' : 'attention';
        state.className = running ? '' : next.state === 'IDLE' ? 'quiet' : 'attention';
        renderElapsed();

        failure.hidden = !next.failure;
        failure.textContent = next.failure || '';
        diff.hidden = !!next.failure || (!next.added && !next.removed);
        if (!diff.hidden) {
          diff.replaceChildren(element('span', 'added', `+${next.added}`),
                               element('span', 'removed', `−${next.removed}`));
        }
        context.hidden = next.context === null || next.context === undefined;
        if (!context.hidden) meterFill.style.width = `${Math.round(next.context * 100)}%`;
        stop.hidden = !next.isBusy;
      };

      // MARK: - Transcript

      const renderTool = tool => {
        const glyph = tool.isError ? '✕' : tool.isRunning ? '⋯' : '✓';
        const wrapper = element('div',
          `tool${tool.isError ? ' error' : tool.isRunning ? ' running' : ''}`);
        const row = element('button', 'tool-row');
        row.type = 'button';
        row.append(element('span', 'tool-glyph', glyph));
        row.append(element('span', 'tool-name', tool.name));
        row.append(element('span', 'tool-argument', tool.argument || ''));
        if (tool.added) row.append(element('span', 'tool-added', `+${tool.added}`));
        wrapper.append(row);

        // The row says what ran; what it said back is a tap away, so a long result never
        // takes the conversation over.
        const body = element('div', 'tool-body');
        body.hidden = !expandedTools.has(tool.id);
        if (tool.input) {
          body.append(element('div', 'tool-label', 'INPUT'));
          body.append(element('pre', '', tool.input));
        }
        if (tool.result) {
          body.append(element('div', 'tool-label', tool.isError ? 'ERROR' : 'RESULT'));
          body.append(element('pre', '', tool.result));
        }
        row.addEventListener('click', () => {
          body.hidden = !body.hidden;
          if (body.hidden) expandedTools.delete(tool.id);
          else expandedTools.add(tool.id);
        });
        wrapper.append(body);
        return wrapper;
      };

      // A person's turn is one tinted bubble; the agent's is plain prose with its calls
      // as rows of their own, which is the same shape the Mac draws.
      const renderMessage = (message, isLast) => {
        const wrapper = element('article', `message ${message.role}`);
        if (message.role === 'user') {
          if (message.text) wrapper.append(element('div', 'bubble', message.text));
        } else if (message.text) {
          const prose = element('div', 'prose', message.text);
          if (isLast && header.state === 'RUNNING') prose.append(element('span', 'cursor'));
          wrapper.append(prose);
        }
        for (const thought of message.thinking || []) {
          wrapper.append(element('div', 'thinking', thought));
        }
        for (const attachment of message.attachments || []) {
          wrapper.append(element('span', 'attachment', attachment));
        }
        for (const tool of message.tools || []) wrapper.append(renderTool(tool));
        return wrapper;
      };

      const atBottom = () => transcript.scrollHeight - transcript.scrollTop
        - transcript.clientHeight < 180;

      const keepAtBottom = wasAtBottom => {
        if (wasAtBottom) requestAnimationFrame(() => { transcript.scrollTop = transcript.scrollHeight; });
      };

      // The order the Mac sent is the authority on layout. Moving nodes that already exist
      // keeps whatever the reader had opened or scrolled inside them.
      const place = () => {
        const wanted = new Set(order);
        for (const id of [...nodes.keys()]) {
          if (!wanted.has(id)) {
            nodes.get(id).remove();
            nodes.delete(id);
          }
        }
        for (const id of [...model.keys()]) if (!wanted.has(id)) model.delete(id);
        const rows = order.map((id, index) => {
          let node = nodes.get(id);
          if (!node) {
            node = renderMessage(model.get(id), index === order.length - 1);
            nodes.set(id, node);
          }
          return node;
        });
        if (header.hasEarlierMessages) {
          rows.unshift(element('div', 'notice', 'EARLIER MESSAGES ARE ON THE MAC'));
        }
        if (!rows.length) rows.push(element('div', 'empty', 'This session has no messages yet.'));
        transcript.replaceChildren(...rows);
      };

      const redrawMessage = id => {
        const existing = nodes.get(id);
        const fresh = renderMessage(model.get(id), order[order.length - 1] === id);
        nodes.set(id, fresh);
        if (existing && existing.parentNode) {
          existing.replaceWith(fresh);
          return true;
        }
        return false;
      };

      const applySnapshot = snapshot => {
        renderHeader(snapshot.header);
        model.clear();
        nodes.clear();
        order = snapshot.messages.map(message => message.id);
        for (const message of snapshot.messages) model.set(message.id, message);
        place();
        renderAsk(snapshot.permission);
        keepAtBottom(true);
      };

      const applyUpdate = update => {
        const wasAtBottom = atBottom();
        const wasRunning = header.state === 'RUNNING';
        if (update.header) renderHeader(update.header);
        let restructured = false;
        if (update.order) {
          order = update.order;
          restructured = true;
        }
        // The cursor rides the last answer, so a turn starting or ending has to redraw it
        // even when the transcript itself did not move.
        if (!restructured && wasRunning !== (header.state === 'RUNNING') && order.length) {
          redrawMessage(order[order.length - 1]);
        }

        const redraw = new Set();
        const appended = new Map();
        for (const change of update.changed || []) {
          if (change.kind === 'full') {
            model.set(change.id, {
              id: change.id,
              role: change.role,
              date: change.date,
              text: change.text || '',
              attachments: change.attachments || [],
              thinking: change.thinking || [],
              tools: change.tools || [],
            });
            redraw.add(change.id);
            continue;
          }
          const message = model.get(change.id);
          // A patch for a message this phone never drew means the two views have drifted
          // apart, and only the Mac can say what the truth is.
          if (!message) {
            send({ type: 'resync' });
            return;
          }
          if (change.textAppend) message.text += change.textAppend;
          for (const tool of change.tools || []) {
            const at = message.tools.findIndex(existing => existing.id === tool.id);
            if (at < 0) message.tools.push(tool);
            else message.tools[at] = tool;
            redraw.add(change.id);
          }
          if (change.textAppend && !redraw.has(change.id)) {
            appended.set(change.id, change.textAppend);
          }
        }

        for (const id of redraw) if (!redrawMessage(id)) restructured = true;
        if (restructured) place();

        // Growing the text in place is what keeps a long answer from rebuilding its whole
        // message on every chunk that arrives.
        for (const [id, text] of appended) {
          const node = nodes.get(id);
          if (!node) continue;
          const prose = node.querySelector('.prose');
          if (prose) {
            const cursor = prose.querySelector('.cursor');
            if (cursor) cursor.before(text);
            else prose.append(text);
            continue;
          }
          redrawMessage(id);
        }

        if (update.permissionCleared) renderAsk(undefined);
        else if (update.permission) renderAsk(update.permission);
        keepAtBottom(wasAtBottom);
      };

      // MARK: - The ask

      const answerFor = question => {
        const saved = answerState.get(question.text) || { choices: new Set(), other: '' };
        const typed = saved.other.trim();
        if (typed) return typed;
        return question.options
          .filter(option => saved.choices.has(option.label))
          .map(option => option.label)
          .join(', ');
      };

      const questionBody = () => {
        const submit = button('allow', 'Submit answers', () => {
          const answers = {};
          for (const question of ask.questions) answers[question.text] = answerFor(question);
          if (send({ type: 'answerPermission', requestID: ask.id, answer: 'answers', answers })) {
            submit.disabled = true;
          }
        });
        const readySubmit = () => {
          submit.disabled = !ask.questions.every(question => answerFor(question));
        };

        const parts = [];
        for (const question of ask.questions) {
          if (!answerState.has(question.text)) {
            answerState.set(question.text, { choices: new Set(), other: '' });
          }
          const saved = answerState.get(question.text);
          const options = element('div', 'options');
          const other = element('input', 'other');
          const paint = () => {
            for (const node of options.children) {
              node.classList.toggle('chosen', saved.choices.has(node.dataset.label));
            }
            readySubmit();
          };
          for (const option of question.options) {
            const choice = button('option', option.label, () => {
              saved.other = '';
              other.value = '';
              if (question.multiSelect) {
                if (saved.choices.has(option.label)) saved.choices.delete(option.label);
                else saved.choices.add(option.label);
              } else {
                const already = saved.choices.has(option.label);
                saved.choices.clear();
                if (!already) saved.choices.add(option.label);
              }
              paint();
            });
            choice.dataset.label = option.label;
            if (option.description) {
              choice.append(element('span', 'option-description', option.description));
            }
            options.append(choice);
          }
          other.placeholder = 'Something else…';
          other.value = saved.other;
          other.addEventListener('input', () => {
            saved.other = other.value;
            if (other.value) saved.choices.clear();
            paint();
          });
          parts.push(element('div', 'question-text', question.text), options, other);
          paint();
        }

        const buttons = element('div', 'buttons');
        buttons.append(button('deny', 'Skip', () =>
          send({ type: 'answerPermission', requestID: ask.id, answer: 'deny' })));
        buttons.append(submit);
        parts.push(buttons);
        return parts;
      };

      const permissionBody = () => {
        const parts = [];
        parts.push(element('div', 'lead', ask.lead));
        if (ask.detail) parts.push(element('p', 'detail', ask.detail));
        if (ask.subject) parts.push(element('pre', 'subject', ask.subject));
        if (ask.runsIn) parts.push(element('div', 'runs-in', `RUNS IN ${ask.runsIn}`));

        const buttons = element('div', 'buttons');
        buttons.append(button('deny', 'Deny', () => {
          denying = true;
          drawSheet();
        }));
        buttons.append(button('allow', 'Allow once', () =>
          send({ type: 'answerPermission', requestID: ask.id, answer: 'allowOnce' })));
        parts.push(buttons);
        if (ask.alwaysTitle) {
          parts.push(button('always', ask.alwaysTitle, () =>
            send({ type: 'answerPermission', requestID: ask.id, answer: 'allowAlways' })));
        }
        return parts;
      };

      const denyBody = () => {
        const reason = element('div', 'reason');
        const field = element('textarea');
        field.placeholder = 'Tell the agent why…';
        field.maxLength = 100000;
        field.setAttribute('aria-label', 'Why this is denied');
        const submit = button('', '↑', () => {
          if (send({ type: 'answerPermission', requestID: ask.id, answer: 'deny',
                     prompt: field.value.trim() })) {
            submit.disabled = true;
          }
        });
        submit.setAttribute('aria-label', 'Send the denial');
        reason.append(field, submit);
        queueMicrotask(() => field.focus());
        return [element('div', 'lead', 'Why not?'), reason];
      };

      const drawSheet = () => {
        sheet?.remove();
        scrim?.remove();
        sheet = undefined;
        scrim = undefined;
        document.body.classList.toggle('asking', !!ask && !collapsed);
        bar.hidden = !ask || !collapsed;
        if (!ask) return;

        const label = ask.kind === 'question' ? 'QUESTION'
                                              : `PERMISSION · ${ask.toolName.toUpperCase()}`;
        if (collapsed) {
          bar.replaceChildren(element('span', 'kind-dot'), element('span', '', label),
                              element('span', 'strip-gap'), element('span', 'open', 'OPEN'));
          return;
        }

        scrim = element('div', '');
        scrim.id = 'scrim';
        scrim.addEventListener('click', () => collapse(true));
        document.body.append(scrim);

        sheet = element('div', '');
        sheet.id = 'sheet';
        sheet.setAttribute('role', 'dialog');
        const handle = element('div', '');
        handle.id = 'handle';
        sheet.append(handle);
        const kind = element('div', 'kind');
        kind.append(element('span', 'kind-dot'), element('span', 'kind-label', label));
        sheet.append(kind);
        const body = denying ? denyBody() : ask.kind === 'question' ? questionBody() : permissionBody();
        sheet.append(...body);
        document.body.append(sheet);
        dragToCollapse(handle);
      };

      const renderAsk = request => {
        if (!request) {
          ask = undefined;
          collapsed = false;
          denying = false;
          answerState.clear();
          drawSheet();
          return;
        }
        if (ask?.id !== request.id) {
          collapsed = false;
          denying = false;
          answerState.clear();
        }
        ask = request;
        drawSheet();
      };

      const collapse = value => {
        if (!ask || collapsed === value) return;
        collapsed = value;
        drawSheet();
      };

      // Pulling the handle down puts the sheet away, which is the gesture the shape of the
      // sheet already promises.
      const dragToCollapse = handle => {
        let start;
        handle.addEventListener('pointerdown', event => {
          start = event.clientY;
          handle.setPointerCapture(event.pointerId);
        });
        handle.addEventListener('pointermove', event => {
          if (start === undefined) return;
          const travelled = event.clientY - start;
          if (travelled > 40) {
            start = undefined;
            collapse(true);
          } else if (travelled > 0) {
            sheet.style.transform = `translateY(${travelled}px)`;
          }
        });
        const settle = () => {
          start = undefined;
          if (sheet) sheet.style.transform = '';
        };
        handle.addEventListener('pointerup', settle);
        handle.addEventListener('pointercancel', settle);
      };

      // MARK: - Connection

      const connect = () => {
        clearTimeout(reconnectTimer);
        if (!secret) {
          title.textContent = 'Pairing code missing';
          state.textContent = 'SCAN THE QR CODE AGAIN';
          showError('The pairing code is missing. Scan the QR code again.');
          return;
        }
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${scheme}://${location.host}/socket/${pairingID}`);
        socket.addEventListener('open', () => {
          setConnected(true);
          socket.send(JSON.stringify({ type: 'authenticate', version: 1, secret }));
        });
        socket.addEventListener('message', event => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.type === 'snapshot') applySnapshot(payload);
            else if (payload.type === 'update') applyUpdate(payload);
            else if (payload.type === 'error') showError(payload.message);
          } catch (_) {
            showError('The Mac sent an unreadable update.');
          }
        });
        socket.addEventListener('close', () => {
          setConnected(false);
          state.textContent = 'RECONNECTING';
          state.className = 'quiet';
          reconnectTimer = setTimeout(connect, 1500);
        });
        socket.addEventListener('error', () => socket.close());
      };

      composer.addEventListener('submit', event => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        if (send({ type: 'sendPrompt', prompt: text })) {
          prompt.value = '';
          prompt.style.height = '';
        }
      });
      prompt.addEventListener('input', () => {
        prompt.style.height = 'auto';
        prompt.style.height = `${Math.min(prompt.scrollHeight, 140)}px`;
      });
      stop.addEventListener('click', () => send({ type: 'stopTurn' }));
      bar.addEventListener('click', () => collapse(false));
      setInterval(renderElapsed, 15000);
      setConnected(false);
      connect();
    })();
  </script>
</body>
</html>
