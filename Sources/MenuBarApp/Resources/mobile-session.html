<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Code Station</title>
  <style>
    /* The palette is the Mac app's own, so the phone reads as the same program seen
       narrow. Sizes are the 300px-wide design scaled by 1.3 for a ~390px viewport. */
    :root {
      color-scheme: light dark;
      --ink: #1c1b16;
      --canvas: #F5F3ED;
      --card: #FFFDF6;
      --hairline: rgba(117, 107, 87, .08);
      --hairline-strong: rgba(117, 107, 87, .14);
      --sunken: rgba(26, 26, 21, .035);
      --field: rgba(26, 26, 21, .05);
      /* The bare marks - a meter's track, the sheet's handle - that carry no fill of
         their own and only read as a groove in the surface. */
      --groove: rgba(26, 26, 21, .1);
      --muted: rgba(28, 27, 22, .62);
      --faint: rgba(28, 27, 22, .5);
      --green: #3E7A46;
      --green-deep: #2F4A33;
      --green-add: #2F6B3A;
      --amber: #C98B1E;
      --amber-text: #8A5D10;
      --amber-line: rgba(201, 139, 30, .5);
      --red: #A33D30;
      --primary: rgba(0, 0, 0, .9);
      --primary-text: #fff;
      --bubble: #E6E9C8;
      --bubble-line: rgba(120, 128, 50, .3);
      --serif: 'New York', 'Iowan Old Style', Palatino, Georgia, serif;
      --sans: -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --mono: ui-monospace, 'SF Mono', Menlo, monospace;
    }
    /* The same tokens as the Mac app wears after dark. The design is drawn light; this is
       its counterpart rather than a second design. */
    @media (prefers-color-scheme: dark) {
      :root {
        --ink: #f2eee4;
        --canvas: #151513;
        --card: #201F1D;
        --hairline: rgba(255, 250, 239, .09);
        --hairline-strong: rgba(255, 250, 239, .14);
        --sunken: rgba(255, 255, 255, .035);
        --field: rgba(255, 255, 255, .05);
        --groove: rgba(255, 255, 255, .13);
        --muted: rgba(242, 238, 228, .62);
        --faint: rgba(242, 238, 228, .5);
        --green: #94C299;
        --green-deep: #94C299;
        --green-add: #9CC46A;
        --amber: #E6B85C;
        --amber-text: #E6B85C;
        --amber-line: rgba(230, 184, 92, .5);
        --red: #D96359;
        --primary: #f2eee4;
        --primary-text: #151513;
        --bubble: #2E3221;
        --bubble-line: rgba(160, 172, 90, .32);
      }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes rise { from { transform: translateY(100%); } to { transform: translateY(0); } }

    * { box-sizing: border-box; }
    /* Several of the rows below are flex, which would otherwise draw over `hidden`. */
    [hidden] { display: none !important; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--card);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input { font: inherit; color: inherit; }
    button { -webkit-tap-highlight-color: transparent; cursor: pointer; }

    /* The two screens the phone has. Only one is ever up, and each fills the window, so
       moving between them is a change of place rather than a scroll. */
    .screen { display: flex; flex: 1; flex-direction: column; min-height: 0; transition: opacity .25s ease-out; }
    /* Everything a sheet rises over. Dimming the pane rather than laying a scrim on top
       keeps the lines above the sheet readable as the context they are. */
    body.asking #session, body.starting #directory { opacity: .32; }

    header {
      display: flex;
      flex: none;
      align-items: center;
      gap: 12px;
      height: calc(65px + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      border-bottom: 1px solid var(--hairline);
      background: var(--card);
    }
    .head-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 1px; }
    .head-title {
      overflow: hidden;
      font: 600 19px/1.2 var(--serif);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .head-where {
      overflow: hidden;
      color: var(--faint);
      font: 11px var(--mono);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    /* Going back is the header's own gesture, so it is the arrow at its edge rather than
       a control in the row below it. */
    #back {
      width: 32px;
      height: 32px;
      flex: none;
      margin-left: -8px;
      padding: 0;
      border: 0;
      background: none;
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
    }
    .light {
      width: 9px;
      height: 9px;
      flex: none;
      border-radius: 50%;
      background: var(--faint);
    }
    .light.running { background: var(--green); animation: pulse 1.6s ease-in-out infinite; }
    .light.attention { background: var(--amber); }
    .light.live { background: var(--green); }

    /* MARK: - The list */

    #projects { flex: 1; overflow-y: auto; background: var(--card); -webkit-overflow-scrolling: touch; }
    .group { border-bottom: 1px solid var(--hairline); }
    .group-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
    }
    .group-toggle {
      display: flex;
      min-width: 0;
      flex: 1;
      align-items: center;
      gap: 10px;
      padding: 14px 0 9px;
      border: 0;
      background: none;
      text-align: left;
    }
    .group-toggle:active { opacity: .72; }
    .group-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 2px; }
    .group-name {
      overflow: hidden;
      font: 600 15.5px var(--sans);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .group-path {
      overflow: hidden;
      color: var(--faint);
      font: 10.5px var(--mono);
      letter-spacing: .4px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .group-chevron {
      flex: none;
      color: var(--faint);
      font-size: 17px;
      transform: rotate(0deg);
      transition: transform .22s ease-out;
    }
    .group.expanded .group-chevron { transform: rotate(90deg); }
    .group-body {
      display: grid;
      grid-template-rows: 0fr;
      opacity: 0;
      transition: grid-template-rows .22s ease-out, opacity .16s ease-out;
    }
    .group.expanded .group-body { grid-template-rows: 1fr; opacity: 1; }
    .group-content { min-height: 0; overflow: hidden; }
    .new {
      flex: none;
      padding: 7px 14px;
      border: 0;
      border-radius: 18px;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 13px;
      font-weight: 600;
    }
    .group-empty {
      padding: 2px 18px 14px;
      color: var(--faint);
      font: 11px var(--mono);
      letter-spacing: .5px;
    }
    .row {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 11px;
      padding: 11px 18px;
      border: 0;
      border-top: 1px solid var(--hairline);
      background: none;
      text-align: left;
    }
    .row:active { background: var(--sunken); }
    .row-copy { display: flex; min-width: 0; flex: 1; flex-direction: column; gap: 3px; }
    .row-title {
      overflow: hidden;
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .row-meta {
      display: flex;
      overflow: hidden;
      gap: 7px;
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: .4px;
      white-space: nowrap;
    }
    .row-meta .added { color: var(--green-add); font-weight: 600; }
    .row-meta .removed { color: var(--red); font-weight: 600; }
    .row-meta .flag { color: var(--amber-text); font-weight: 600; }
    .chevron { flex: none; color: var(--faint); font-size: 17px; }
    /* The tail of a long list, folded away until it is asked for. It reads as a label
       rather than a row, since there is no session behind it to open. */
    .more {
      display: block;
      width: 100%;
      padding: 12px 18px;
      border: 0;
      border-top: 1px solid var(--hairline);
      background: none;
      color: var(--muted);
      font: 600 11px var(--mono);
      letter-spacing: .5px;
      text-align: center;
    }
    .more:active { background: var(--sunken); }

    @media (prefers-reduced-motion: reduce) {
      .group-chevron, .group-body { transition: none; }
    }

    /* MARK: - The status strip */

    #strip {
      display: flex;
      flex: none;
      align-items: center;
      gap: 12px;
      height: 36px;
      padding: 0 18px;
      border-bottom: 1px solid rgba(117, 107, 87, .06);
      background: var(--sunken);
      color: var(--muted);
      font: 11px var(--mono);
      letter-spacing: .5px;
    }
    #state { flex: none; font-weight: 600; color: var(--green-deep); }
    #state.attention { color: var(--amber-text); }
    #state.quiet { color: var(--muted); }
    #diff { display: flex; flex: none; gap: 5px; font-weight: 600; }
    #diff .added { color: var(--green-add); }
    #diff .removed { color: var(--red); }
    #failure {
      overflow: hidden;
      flex: 1;
      color: var(--red);
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .strip-gap { flex: 1; }
    #context { display: flex; flex: none; align-items: center; gap: 9px; }
    .meter { width: 44px; height: 4px; overflow: hidden; border-radius: 3px; background: var(--groove); }
    .meter span { display: block; height: 100%; background: var(--green); }
    /* Stopping the turn is not part of the strip's grammar, so it sits at its end as one
       small red word rather than as a control. */
    #stop { flex: none; padding: 0; border: 0; background: none; color: var(--red);
            font: 600 11px var(--mono); letter-spacing: .5px; }

    #transcript {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 13px;
      padding: 16px;
      overflow-y: auto;
      background: var(--card);
      -webkit-overflow-scrolling: touch;
    }
    .message { display: flex; flex-direction: column; gap: 13px; }
    .notice, .empty {
      color: var(--faint);
      font: 11px var(--mono);
      letter-spacing: .5px;
      text-align: center;
    }
    .empty { padding: 60px 20px; font-family: var(--sans); font-size: 14px; letter-spacing: 0; }

    .bubble {
      max-width: 73%;
      align-self: flex-end;
      padding: 10px 14px;
      border: 1px solid var(--bubble-line);
      border-radius: 14px 14px 5px 14px;
      background: var(--bubble);
      font-size: 15.5px;
      line-height: 1.45;
    }
    .prose { font-size: 15.5px; line-height: 1.5; }
    .prose, .bubble, .thinking, pre { overflow-wrap: anywhere; white-space: pre-wrap; }
    .system .prose, .instructions .prose { color: var(--muted); font-size: 14px; }
    .prose-code {
      margin: 9px 0;
      overflow: hidden;
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      background: var(--field);
    }
    .prose-code:first-child { margin-top: 0; }
    .prose-code:last-child { margin-bottom: 0; }
    .code-language {
      padding: 8px 11px 0;
      color: var(--faint);
      font: 700 10px var(--mono);
      letter-spacing: .8px;
    }
    .prose-code pre {
      margin: 0;
      overflow-x: auto;
      padding: 10px 11px;
      overflow-wrap: normal;
      font: 12px/1.5 var(--mono);
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }
    .thinking {
      padding-left: 11px;
      border-left: 2px solid var(--hairline-strong);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .attachment {
      align-self: flex-start;
      padding: 5px 9px;
      border-radius: 8px;
      background: var(--field);
      color: var(--muted);
      font: 12px var(--mono);
    }
    .cursor {
      display: inline-block;
      width: 9px;
      height: 16px;
      margin-left: 3px;
      background: var(--ink);
      vertical-align: text-bottom;
      animation: pulse 1.1s ease-in-out infinite;
    }

    .tool { border: 1px solid rgba(117, 107, 87, .1); border-radius: 10px; background: rgba(26, 26, 21, .04); }
    .tool-row {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 12px;
      border: 0;
      background: none;
      font: 12.5px var(--mono);
      color: var(--muted);
      text-align: left;
    }
    .tool-glyph { flex: none; font-weight: 700; color: var(--green-add); }
    .tool.running .tool-glyph { color: var(--muted); animation: pulse 1.6s ease-in-out infinite; }
    .tool.error .tool-glyph { color: var(--red); }
    .tool-name { flex: none; font-weight: 600; color: var(--ink); }
    .tool-argument { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tool-added { flex: none; margin-left: auto; padding-left: 9px; font-weight: 600; color: var(--green-add); }
    .tool-body { padding: 0 12px 12px; }
    .tool-label { margin: 9px 0 5px; color: var(--faint); font: 700 10px var(--mono); letter-spacing: .9px; }
    .tool-body pre {
      max-height: 300px;
      margin: 0;
      overflow: auto;
      padding: 10px;
      border-radius: 8px;
      background: var(--card);
      font: 12px/1.45 var(--mono);
    }

    #queued {
      max-height: 190px;
      flex: none;
      overflow-y: auto;
      padding: 10px 16px;
      border-top: 1px solid var(--hairline);
      background: var(--card);
      -webkit-overflow-scrolling: touch;
    }
    .queued-head {
      color: var(--green-deep);
      font: 600 10.5px var(--mono);
      letter-spacing: .8px;
    }
    .queued-list { display: flex; flex-direction: column; gap: 7px; margin-top: 8px; }
    .queued-item {
      padding: 9px 11px;
      border: 1px solid var(--hairline-strong);
      border-radius: 9px;
      background: var(--field);
    }
    .queued-text {
      display: -webkit-box;
      overflow: hidden;
      font-size: 13px;
      line-height: 1.4;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .queued-attachments {
      margin-top: 5px;
      color: var(--muted);
      font: 10.5px var(--mono);
      overflow-wrap: anywhere;
    }

    #composer {
      display: flex;
      flex: none;
      align-items: center;
      gap: 10px;
      padding: 13px 16px calc(13px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--hairline);
      background: var(--card);
    }
    #prompt {
      min-height: 47px;
      max-height: 140px;
      flex: 1;
      resize: none;
      padding: 13px 18px;
      border: 1px solid var(--hairline-strong);
      border-radius: 24px;
      outline: none;
      background: var(--field);
      font-size: 15.5px;
      line-height: 1.35;
    }
    #prompt::placeholder { color: rgba(28, 27, 22, .45); }
    @media (prefers-color-scheme: dark) { #prompt::placeholder { color: rgba(242, 238, 228, .45); } }
    #send {
      display: flex;
      width: 47px;
      height: 47px;
      flex: none;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 19px;
    }
    button:disabled { opacity: .4; cursor: default; }

    /* What catches the tap on the dimmed screen behind a sheet. Whatever is under here is
       context to read, not something to work in, so nothing in it is reachable. */
    #scrim { position: fixed; inset: 0; z-index: 4; }

    /* A sheet: the ask, and the few lines that start a session. Both are anchored to the
       foot of the same screen rather than a page of their own, so answering one never
       costs the reader their place. */
    .sheet {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 5;
      display: flex;
      max-height: 88%;
      flex-direction: column;
      gap: 14px;
      overflow-y: auto;
      padding: 18px 21px calc(18px + env(safe-area-inset-bottom));
      border-top: 1.8px solid var(--hairline-strong);
      border-radius: 23px 23px 0 0;
      background: var(--card);
      box-shadow: 0 -18px 52px rgba(28, 25, 15, .18);
      animation: rise .25s ease-out;
    }
    #sheet { border-top-color: var(--amber-line); }
    .handle {
      width: 44px;
      height: 5px;
      flex: none;
      align-self: center;
      border-radius: 3px;
      background: var(--groove);
      /* The strip you grab is thin, so the reach around it is widened rather than the
         mark itself. */
      box-shadow: 0 -14px 0 0 transparent, 0 14px 0 0 transparent;
      touch-action: none;
    }
    .kind { display: flex; align-items: center; gap: 9px; }
    .kind-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); }
    .kind-label { color: var(--amber-text); font: 600 11.5px var(--mono); letter-spacing: 1.4px; }
    .lead { font-size: 17px; font-weight: 600; }
    .detail { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .subject {
      max-height: 220px;
      margin: 0;
      overflow: auto;
      padding: 12px 14px;
      border: 1px solid var(--hairline-strong);
      border-radius: 10px;
      background: var(--field);
      font: 14px/1.4 var(--mono);
    }
    .runs-in { color: var(--faint); font: 11.5px var(--mono); letter-spacing: .5px; }
    .buttons { display: flex; gap: 10px; }
    .buttons button { height: 52px; border-radius: 13px; font-size: 16px; font-weight: 600; }
    .deny { flex: 1; border: 1px solid rgba(163, 61, 48, .4); background: none; color: var(--red); }
    /* Walking away from a sheet is not a refusal, so it carries no colour of its own. */
    .quiet { flex: 1; border: 1px solid var(--hairline-strong); background: none; color: var(--muted); }
    .allow { flex: 1.4; border: 0; background: var(--primary); color: var(--primary-text); }
    .always {
      padding: 0;
      border: 0;
      background: none;
      color: var(--green-deep);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
    }

    /* Denying is the start of an answer rather than the whole of it, so the sheet stays
       and turns into the field where the reason gets typed. */
    .reason { display: flex; align-items: center; gap: 10px; }
    .reason textarea {
      min-height: 47px;
      max-height: 120px;
      flex: 1;
      resize: none;
      padding: 13px 18px;
      border: 1px solid var(--hairline-strong);
      border-radius: 24px;
      outline: none;
      background: var(--field);
      font-size: 15.5px;
      line-height: 1.35;
    }
    .reason button {
      width: 47px;
      height: 47px;
      flex: none;
      border: 0;
      border-radius: 50%;
      background: var(--primary);
      color: var(--primary-text);
      font-size: 19px;
    }

    .question-text { font-size: 17px; font-weight: 600; }
    .option {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--hairline-strong);
      border-radius: 12px;
      background: var(--field);
      font-size: 15px;
      font-weight: 600;
      text-align: left;
    }
    .option.chosen { border-color: var(--green); background: rgba(62, 122, 70, .1); color: var(--green-deep); }
    .option-description { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; font-weight: 400; }
    .options { display: flex; flex-direction: column; gap: 8px; }
    .other {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--hairline-strong);
      border-radius: 12px;
      outline: none;
      background: var(--field);
      font-size: 15px;
    }

    /* The first prompt and where the work happens, which is everything the phone gets to
       decide about a new session. The rest comes from the Mac's own defaults. */
    #new-prompt {
      min-height: 96px;
      max-height: 200px;
      resize: none;
      padding: 13px 15px;
      border: 1px solid var(--hairline-strong);
      border-radius: 12px;
      outline: none;
      background: var(--field);
      font-size: 15.5px;
      line-height: 1.4;
    }

    /* The ask folded away. It keeps the amber and stays answerable, so putting the sheet
       down is not the same as ignoring it. */
    #bar {
      display: flex;
      flex: none;
      align-items: center;
      gap: 9px;
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-top: 1px solid var(--amber-line);
      background: rgba(201, 139, 30, .12);
      color: var(--amber-text);
      font: 600 11.5px var(--mono);
      letter-spacing: 1.4px;
      text-align: left;
    }
    #bar .strip-gap { letter-spacing: 0; }
    #bar .open { font-weight: 600; letter-spacing: .5px; }

    #toast {
      position: fixed;
      z-index: 10;
      top: calc(14px + env(safe-area-inset-top));
      right: 16px;
      left: 16px;
      padding: 12px 15px;
      border-radius: 12px;
      background: var(--red);
      color: #fff;
      font-size: 14px;
      transform: translateY(-160%);
      transition: transform .2s ease-out;
    }
    #toast.visible { transform: translateY(0); }
  </style>
</head>
<body>
  <div id="toast" role="alert"></div>

  <div id="directory" class="screen" hidden>
    <header>
      <div class="head-copy">
        <div id="list-title" class="head-title">Connecting…</div>
        <div id="list-where" class="head-where">Teya Code Station</div>
      </div>
      <span id="list-light" class="light" aria-label="Disconnected"></span>
    </header>
    <main id="projects"><div class="empty">Connecting to your Mac…</div></main>
  </div>

  <div id="session" class="screen" hidden>
    <header>
      <button id="back" type="button" aria-label="Back to the list" hidden>‹</button>
      <div class="head-copy">
        <div id="title" class="head-title">Connecting…</div>
        <div id="where" class="head-where">Teya Code Station</div>
      </div>
      <span id="light" class="light" aria-label="Disconnected"></span>
    </header>
    <div id="strip">
      <span id="state" class="quiet">CONNECTING</span>
      <span id="diff" hidden></span>
      <span id="failure" hidden></span>
      <span class="strip-gap"></span>
      <button id="stop" type="button" hidden>STOP</button>
      <span id="context" hidden>CTX<span class="meter"><span id="meter-fill"></span></span></span>
    </div>
    <main id="transcript"><div class="empty">Connecting to your Mac…</div></main>
    <section id="queued" aria-label="Queued messages" hidden>
      <div id="queued-head" class="queued-head"></div>
      <div id="queued-list" class="queued-list"></div>
    </section>
    <button id="bar" type="button" hidden></button>
    <form id="composer">
      <textarea id="prompt" maxlength="100000" placeholder="Nudge the session…"
                aria-label="Nudge the session"></textarea>
      <button id="send" type="submit" aria-label="Send prompt">↑</button>
    </form>
  </div>

  <script>
    (() => {
      const pairingID = location.pathname.split('/').filter(Boolean).pop();
      const fragment = new URLSearchParams(location.hash.slice(1));
      const storageKey = `code-station-pairing-${pairingID}`;
      const scannedSecret = fragment.get('secret');
      if (scannedSecret) sessionStorage.setItem(storageKey, scannedSecret);
      const secret = scannedSecret || sessionStorage.getItem(storageKey);
      if (location.hash) history.replaceState(null, '', location.pathname);

      const find = id => document.querySelector(`#${id}`);
      const directoryScreen = find('directory');
      const sessionScreen = find('session');
      const listTitle = find('list-title');
      const listWhere = find('list-where');
      const listLight = find('list-light');
      const projects = find('projects');
      const back = find('back');
      const light = find('light');
      const title = find('title');
      const where = find('where');
      const state = find('state');
      const diff = find('diff');
      const failure = find('failure');
      const context = find('context');
      const meterFill = find('meter-fill');
      const stop = find('stop');
      const transcript = find('transcript');
      const queuedPanel = find('queued');
      const queuedHead = find('queued-head');
      const queuedList = find('queued-list');
      const bar = find('bar');
      const composer = find('composer');
      const prompt = find('prompt');
      const sendButton = find('send');
      const toast = find('toast');
      let socket;
      let reconnectTimer;
      let toastTimer;
      let sheet;
      let scrim;
      let ask;
      // Which screen is up. The Mac decides it: a list arrives, or a session does.
      let screen = 'directory';
      // The list as the Mac last described it, so the new-session sheet can name the
      // project it is about without asking for it again.
      let listing = { title: '', canCreate: false, projects: [] };
      // Projects start shut. Once opened, their newest few sessions match the rail on the
      // Mac, with the rest under see-more. Both choices survive list updates from the Mac.
      const sessionLimit = 4;
      const expandedProjects = new Set();
      const unfolded = new Set();
      let creating = false;
      // Whether the ask has been put down. It survives an update to the ask itself, so a
      // sheet folded away does not spring back up when a tool result lands behind it.
      let collapsed = false;
      let denying = false;
      const answerState = new Map();
      const expandedTools = new Set();
      // The transcript this phone has drawn, so an update only has to carry what moved.
      const model = new Map();
      const nodes = new Map();
      let order = [];
      let queuedPrompts = [];
      let header = {};

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };

      const button = (className, text, handler) => {
        const node = element('button', className, text);
        node.type = 'button';
        node.addEventListener('click', handler);
        return node;
      };

      const showError = message => {
        toast.textContent = message;
        toast.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('visible'), 4500);
      };

      const send = command => {
        if (!socket || socket.readyState !== WebSocket.OPEN) {
          showError('The Mac is not connected.');
          return false;
        }
        socket.send(JSON.stringify(command));
        return true;
      };

      const setConnected = live => {
        for (const dot of [light, listLight]) {
          dot.setAttribute('aria-label', live ? 'Connected' : 'Disconnected');
        }
        // The session light says what the session is doing, so only the list light is
        // free to say whether the Mac is still on the other end.
        listLight.className = live ? 'light live' : 'light';
        if (!live) light.className = 'light';
        sendButton.disabled = !live;
      };

      const show = next => {
        screen = next;
        directoryScreen.hidden = next !== 'directory';
        sessionScreen.hidden = next !== 'session';
      };

      // How long ago something happened, in the one or two characters the rows have room
      // for. Drawn here rather than sent, so an idle list costs nothing to keep current.
      const ago = when => {
        const seconds = Math.max(0, (Date.now() - Date.parse(when)) / 1000);
        if (seconds < 60) return 'NOW';
        if (seconds < 3600) return `${Math.floor(seconds / 60)}M`;
        if (seconds < 86400) return `${Math.floor(seconds / 3600)}H`;
        if (seconds < 604800) return `${Math.floor(seconds / 86400)}D`;
        return `${Math.floor(seconds / 604800)}W`;
      };

      // MARK: - The list

      const sessionRow = session => {
        const row = element('button', 'row');
        row.type = 'button';
        const dot = element('span', 'light');
        if (session.state === 'RUNNING') dot.classList.add('running');
        else if (session.state !== 'IDLE') dot.classList.add('attention');
        row.append(dot);

        const copy = element('div', 'row-copy');
        copy.append(element('div', 'row-title', session.title));
        const meta = element('div', 'row-meta');
        if (session.state !== 'IDLE') meta.append(element('span', 'flag', session.state));
        meta.append(element('span', '', ago(session.lastActivity)));
        meta.append(element('span', '', session.workspace || session.branch || session.agent));
        if (session.added || session.removed) {
          meta.append(element('span', 'added', `+${session.added}`));
          meta.append(element('span', 'removed', `−${session.removed}`));
        }
        copy.append(meta);
        row.append(copy);
        row.append(element('span', 'chevron', '›'));
        row.addEventListener('click', () => send({ type: 'openSession', sessionID: session.id }));
        return row;
      };

      const projectGroup = project => {
        const expanded = expandedProjects.has(project.id);
        const group = element('div', `group${expanded ? ' expanded' : ''}`);
        const head = element('div', 'group-head');
        const toggle = element('button', 'group-toggle');
        toggle.type = 'button';
        toggle.setAttribute('aria-expanded', String(expanded));
        const copy = element('div', 'group-copy');
        copy.append(element('div', 'group-name', project.name));
        copy.append(element('div', 'group-path',
          project.isMissing ? 'MISSING FROM DISK' : project.path));
        toggle.append(copy);
        toggle.append(element('span', 'group-chevron', '›'));
        head.append(toggle);
        if (listing.canCreate && !project.isMissing) {
          head.append(button('new', 'New', () => openNewSheet(project)));
        }
        group.append(head);

        const body = element('div', 'group-body');
        const content = element('div', 'group-content');
        body.inert = !expanded;
        body.setAttribute('aria-hidden', String(!expanded));
        if (!project.sessions.length) {
          content.append(element('div', 'group-empty', 'NO SESSIONS YET'));
        }
        const visible = unfolded.has(project.id)
          ? project.sessions
          : project.sessions.slice(0, sessionLimit);
        for (const session of visible) content.append(sessionRow(session));
        const hidden = project.sessions.length - visible.length;
        if (hidden) {
          content.append(button('more', `SHOW ${hidden} MORE`, () => {
            unfolded.add(project.id);
            renderDirectory(listing);
          }));
        }
        body.append(content);
        group.append(body);

        toggle.addEventListener('click', () => {
          const willExpand = !expandedProjects.has(project.id);
          if (willExpand) expandedProjects.add(project.id);
          else expandedProjects.delete(project.id);
          group.classList.toggle('expanded', willExpand);
          toggle.setAttribute('aria-expanded', String(willExpand));
          body.inert = !willExpand;
          body.setAttribute('aria-hidden', String(!willExpand));
        });
        return group;
      };

      const renderDirectory = payload => {
        listing = payload;
        listTitle.textContent = payload.title;
        const sessions = payload.projects.reduce((count, p) => count + p.sessions.length, 0);
        const running = payload.projects.reduce((count, p) =>
          count + p.sessions.filter(s => s.state === 'RUNNING').length, 0);
        const waiting = payload.projects.reduce((count, p) =>
          count + p.sessions.filter(s => s.state === 'NEEDS YOU').length, 0);
        const parts = [`${sessions} session${sessions === 1 ? '' : 's'}`];
        if (running) parts.push(`${running} running`);
        if (waiting) parts.push(`${waiting} needs you`);
        listWhere.textContent = parts.join(' · ').toUpperCase();
        document.title = `${payload.title} · Code Station`;

        const groups = payload.projects.map(projectGroup);
        if (!groups.length) {
          groups.push(element('div', 'empty', 'There are no projects on this Mac yet.'));
        }
        projects.replaceChildren(...groups);
        if (screen !== 'directory') show('directory');
        // The sheet names a project, and the project it named may be gone.
        if (newSheet) {
          const still = payload.projects.find(project => project.id === newProject.id);
          if (still) newProject = still;
          else closeNewSheet();
        }
      };

      // MARK: - Starting a session

      let newSheet;
      let newProject;
      let newWorktree = true;

      const openNewSheet = project => {
        newProject = project;
        newWorktree = project.isGit;
        creating = false;
        drawNewSheet();
      };

      const closeNewSheet = () => {
        newSheet?.remove();
        newSheet = undefined;
        newProject = undefined;
        scrim?.remove();
        scrim = undefined;
        document.body.classList.remove('starting');
        drawSheet();
      };

      const drawNewSheet = () => {
        newSheet?.remove();
        scrim?.remove();
        document.body.classList.add('starting');
        scrim = element('div', '');
        scrim.id = 'scrim';
        scrim.addEventListener('click', () => { if (!creating) closeNewSheet(); });
        document.body.append(scrim);

        newSheet = element('div', 'sheet');
        newSheet.setAttribute('role', 'dialog');
        const handle = element('div', 'handle');
        newSheet.append(handle);
        newSheet.append(element('div', 'lead', `New session in ${newProject.name}`));

        const field = element('textarea');
        field.id = 'new-prompt';
        field.maxLength = 100000;
        field.placeholder = 'What should it do? (optional)';
        field.setAttribute('aria-label', 'First prompt');
        newSheet.append(field);

        // A plain folder has nothing to choose between, so the choice only appears where
        // it means something.
        if (newProject.isGit) {
          const options = element('div', 'options');
          const paint = () => {
            for (const node of options.children) {
              node.classList.toggle('chosen', node.dataset.worktree === String(newWorktree));
            }
          };
          const worktree = button('option', 'Its own worktree', () => {
            newWorktree = true;
            paint();
          });
          worktree.dataset.worktree = 'true';
          worktree.append(element('span', 'option-description',
            'An isolated checkout on a new branch, so it can run alongside the others.'));
          const folder = button('option', 'The project folder', () => {
            newWorktree = false;
            paint();
          });
          folder.dataset.worktree = 'false';
          folder.append(element('span', 'option-description',
            'Edits the working tree on your Mac directly.'));
          options.append(worktree, folder);
          newSheet.append(options);
          paint();
        }

        const buttons = element('div', 'buttons');
        buttons.append(button('quiet', 'Cancel', () => { if (!creating) closeNewSheet(); }));
        const create = button('allow', creating ? 'Starting…' : 'Create session', () => {
          if (creating) return;
          if (send({ type: 'createSession', projectID: newProject.id,
                     worktree: newWorktree, prompt: field.value.trim() })) {
            creating = true;
            create.textContent = 'Starting…';
            create.disabled = true;
          }
        });
        buttons.append(create);
        newSheet.append(buttons);
        document.body.append(newSheet);
        dragToDismiss(handle, () => { if (!creating) closeNewSheet(); });
      };

      // MARK: - Status strip

      // "4M" while a turn runs, counting from when it was asked for; "2H" otherwise,
      // counting from the last thing that happened. Both are drawn here rather than sent,
      // so an idle session costs nothing to keep current.
      const elapsed = () => {
        if (!header.since) return '';
        const seconds = Math.max(0, (Date.now() - Date.parse(header.since)) / 1000);
        if (header.state === 'RUNNING') {
          if (seconds < 60) return `${Math.floor(seconds)}S`;
          if (seconds < 3600) return `${Math.floor(seconds / 60)}M`;
          if (seconds < 86400) return `${Math.floor(seconds / 3600)}H`;
          return `${Math.floor(seconds / 86400)}D`;
        }
        return ago(header.since);
      };

      const renderElapsed = () => {
        if (!header.state) return;
        const queueStatus = header.queuedPrompts ? ` · ${header.queuedPrompts} QUEUED` : '';
        state.textContent = `${header.state} · ${elapsed()}${queueStatus}`;
      };

      const renderQueue = () => {
        queuedPanel.hidden = !queuedPrompts.length;
        if (!queuedPrompts.length) {
          queuedList.replaceChildren();
          return;
        }
        queuedHead.textContent = header.isBusy
          ? `QUEUED · ${queuedPrompts.length} · RUNS WHEN THIS TURN ENDS`
          : `QUEUED · ${queuedPrompts.length}`;
        queuedList.replaceChildren(...queuedPrompts.map(prompt => {
          const item = element('div', 'queued-item');
          if (prompt.text) item.append(element('div', 'queued-text', prompt.text));
          if (prompt.attachments?.length) {
            item.append(element('div', 'queued-attachments', prompt.attachments.join(' · ')));
          }
          return item;
        }));
      };

      const renderHeader = next => {
        header = next;
        title.textContent = next.title;
        where.textContent = next.branch ? `${next.project} · ${next.branch}`
                                        : `${next.project} · ${next.agent}`;
        document.title = `${next.title} · Code Station`;

        const running = next.state === 'RUNNING';
        light.className = `light ${running ? 'running' : next.state === 'IDLE' ? '' : 'attention'}`;
        state.className = running ? '' : next.state === 'IDLE' ? 'quiet' : 'attention';
        renderElapsed();
        renderQueue();

        failure.hidden = !next.failure;
        failure.textContent = next.failure || '';
        diff.hidden = !!next.failure || (!next.added && !next.removed);
        if (!diff.hidden) {
          diff.replaceChildren(element('span', 'added', `+${next.added}`),
                               element('span', 'removed', `−${next.removed}`));
        }
        context.hidden = next.context === null || next.context === undefined;
        if (!context.hidden) meterFill.style.width = `${Math.round(next.context * 100)}%`;
        stop.hidden = !next.isBusy;
      };

      // MARK: - Transcript

      const renderTool = tool => {
        const glyph = tool.isError ? '✕' : tool.isRunning ? '⋯' : '✓';
        const wrapper = element('div',
          `tool${tool.isError ? ' error' : tool.isRunning ? ' running' : ''}`);
        const row = element('button', 'tool-row');
        row.type = 'button';
        row.append(element('span', 'tool-glyph', glyph));
        row.append(element('span', 'tool-name', tool.name));
        row.append(element('span', 'tool-argument', tool.argument || ''));
        if (tool.added) row.append(element('span', 'tool-added', `+${tool.added}`));
        wrapper.append(row);

        // The row says what ran; what it said back is a tap away, so a long result never
        // takes the conversation over.
        const body = element('div', 'tool-body');
        body.hidden = !expandedTools.has(tool.id);
        if (tool.input) {
          body.append(element('div', 'tool-label', 'INPUT'));
          body.append(element('pre', '', tool.input));
        }
        if (tool.result) {
          body.append(element('div', 'tool-label', tool.isError ? 'ERROR' : 'RESULT'));
          body.append(element('pre', '', tool.result));
        }
        row.addEventListener('click', () => {
          body.hidden = !body.hidden;
          if (body.hidden) expandedTools.delete(tool.id);
          else expandedTools.add(tool.id);
        });
        wrapper.append(body);
        return wrapper;
      };

      // Fenced code stays source text on the phone, matching the transcript on the Mac.
      // The last segment may still be open while an answer streams, so an unmatched fence
      // is treated as code until its closing fence arrives.
      const fencedSegments = text => text.split('```').flatMap((part, index) => {
        if (index % 2 === 0) {
          const prose = part.trim();
          return prose ? [{ kind: 'prose', text: prose }] : [];
        }

        let code = part;
        let language;
        const newline = part.indexOf('\n');
        if (newline >= 0) {
          const firstLine = part.slice(0, newline).trim();
          if (!firstLine || !firstLine.includes(' ')) {
            language = firstLine || undefined;
            code = part.slice(newline + 1);
          }
        }
        code = code.replace(/^\n+|\n+$/g, '');
        return code ? [{ kind: 'code', text: code, language }] : [];
      });

      const renderProse = (text, showCursor) => {
        const prose = element('div', 'prose');
        for (const segment of fencedSegments(text)) {
          if (segment.kind === 'prose') {
            prose.append(document.createTextNode(segment.text));
            continue;
          }
          const code = element('div', 'prose-code');
          if (segment.language) {
            code.append(element('div', 'code-language', segment.language.toUpperCase()));
          }
          code.append(element('pre', '', segment.text));
          prose.append(code);
        }
        if (showCursor) prose.append(element('span', 'cursor'));
        return prose;
      };

      // A person's turn is one tinted bubble; the agent's is plain prose with its calls
      // as rows of their own, which is the same shape the Mac draws.
      const renderMessage = (message, isLast) => {
        const wrapper = element('article', `message ${message.role}`);
        if (message.role === 'user') {
          if (message.text) wrapper.append(element('div', 'bubble', message.text));
        } else {
          const blocks = message.blocks || [];
          let lastProse = -1;
          for (let index = blocks.length - 1; index >= 0; index--) {
            if (blocks[index].kind === 'prose') {
              lastProse = index;
              break;
            }
          }
          for (const [index, block] of blocks.entries()) {
            if (block.kind === 'prose') {
              wrapper.append(renderProse(
                block.text || '',
                isLast && header.state === 'RUNNING' && index === lastProse));
            } else if (block.kind === 'thinking') {
              wrapper.append(element('div', 'thinking', block.text || ''));
            } else if (block.kind === 'tools') {
              for (const tool of block.tools || []) wrapper.append(renderTool(tool));
            }
          }
        }
        for (const attachment of message.attachments || []) {
          wrapper.append(element('span', 'attachment', attachment));
        }
        return wrapper;
      };

      const atBottom = () => transcript.scrollHeight - transcript.scrollTop
        - transcript.clientHeight < 180;

      const keepAtBottom = wasAtBottom => {
        if (wasAtBottom) requestAnimationFrame(() => { transcript.scrollTop = transcript.scrollHeight; });
      };

      // The order the Mac sent is the authority on layout. Moving nodes that already exist
      // keeps whatever the reader had opened or scrolled inside them.
      const place = () => {
        const wanted = new Set(order);
        for (const id of [...nodes.keys()]) {
          if (!wanted.has(id)) {
            nodes.get(id).remove();
            nodes.delete(id);
          }
        }
        for (const id of [...model.keys()]) if (!wanted.has(id)) model.delete(id);
        const rows = order.map((id, index) => {
          let node = nodes.get(id);
          if (!node) {
            node = renderMessage(model.get(id), index === order.length - 1);
            nodes.set(id, node);
          }
          return node;
        });
        if (header.hasEarlierMessages) {
          rows.unshift(element('div', 'notice', 'EARLIER MESSAGES ARE ON THE MAC'));
        }
        if (!rows.length) rows.push(element('div', 'empty', 'This session has no messages yet.'));
        transcript.replaceChildren(...rows);
      };

      const redrawMessage = id => {
        const existing = nodes.get(id);
        const fresh = renderMessage(model.get(id), order[order.length - 1] === id);
        nodes.set(id, fresh);
        if (existing && existing.parentNode) {
          existing.replaceWith(fresh);
          return true;
        }
        return false;
      };

      const applySnapshot = snapshot => {
        // A snapshot is also the answer to "start a session": it lands on the new one.
        if (newSheet) {
          creating = false;
          closeNewSheet();
        }
        back.hidden = !snapshot.canBrowse;
        queuedPrompts = snapshot.queued || [];
        renderHeader(snapshot.header);
        model.clear();
        nodes.clear();
        order = snapshot.messages.map(message => message.id);
        for (const message of snapshot.messages) model.set(message.id, message);
        place();
        renderAsk(snapshot.permission);
        if (screen !== 'session') show('session');
        keepAtBottom(true);
      };

      const applyUpdate = update => {
        const wasAtBottom = atBottom();
        const wasRunning = header.state === 'RUNNING';
        const queueChanged = update.queued !== undefined;
        if (queueChanged) queuedPrompts = update.queued || [];
        if (update.header) renderHeader(update.header);
        else if (queueChanged) renderQueue();
        let restructured = false;
        if (update.order) {
          order = update.order;
          restructured = true;
        }
        // The cursor rides the last answer, so a turn starting or ending has to redraw it
        // even when the transcript itself did not move.
        if (!restructured && wasRunning !== (header.state === 'RUNNING') && order.length) {
          redrawMessage(order[order.length - 1]);
        }

        const redraw = new Set();
        const appended = new Map();
        for (const change of update.changed || []) {
          if (change.kind === 'full') {
            model.set(change.id, {
              id: change.id,
              role: change.role,
              date: change.date,
              text: change.text || '',
              attachments: change.attachments || [],
              blocks: change.blocks || [],
            });
            redraw.add(change.id);
            continue;
          }
          const message = model.get(change.id);
          // A patch for a message this phone never drew means the two views have drifted
          // apart, and only the Mac can say what the truth is.
          if (!message) {
            send({ type: 'resync' });
            return;
          }
          if (change.textAppend) {
            message.text += change.textAppend;
            const prose = [...message.blocks].reverse().find(block => block.kind === 'prose');
            if (!prose) {
              send({ type: 'resync' });
              return;
            }
            prose.text = (prose.text || '') + change.textAppend;
          }
          for (const tool of change.tools || []) {
            const block = message.blocks.find(candidate =>
              candidate.kind === 'tools'
                && (candidate.tools || []).some(existing => existing.id === tool.id));
            if (!block) {
              send({ type: 'resync' });
              return;
            }
            const at = block.tools.findIndex(existing => existing.id === tool.id);
            block.tools[at] = tool;
            redraw.add(change.id);
          }
          if (change.textAppend && !redraw.has(change.id)) {
            appended.set(change.id, change.textAppend);
          }
        }

        for (const id of redraw) if (!redrawMessage(id)) restructured = true;
        if (restructured) place();

        // Growing the text in place is what keeps a long answer from rebuilding its whole
        // message on every chunk that arrives.
        for (const [id, text] of appended) {
          const node = nodes.get(id);
          if (!node) continue;
          const proseBlocks = node.querySelectorAll('.prose');
          const prose = proseBlocks[proseBlocks.length - 1];
          if (prose) {
            const cursor = prose.querySelector('.cursor');
            const message = model.get(id);
            const block = [...(message?.blocks || [])].reverse()
              .find(candidate => candidate.kind === 'prose');
            if ((block?.text || '').includes('```')) {
              prose.replaceWith(renderProse(block.text || '', !!cursor));
              continue;
            }
            if (cursor) cursor.before(text);
            else prose.append(text);
            continue;
          }
          redrawMessage(id);
        }

        if (update.permissionCleared) renderAsk(undefined);
        else if (update.permission) renderAsk(update.permission);
        keepAtBottom(wasAtBottom);
      };

      // MARK: - The ask

      const answerFor = question => {
        const saved = answerState.get(question.text) || { choices: new Set(), other: '' };
        const typed = saved.other.trim();
        if (typed) return typed;
        return question.options
          .filter(option => saved.choices.has(option.label))
          .map(option => option.label)
          .join(', ');
      };

      const questionBody = () => {
        const submit = button('allow', 'Submit answers', () => {
          const answers = {};
          for (const question of ask.questions) answers[question.text] = answerFor(question);
          if (send({ type: 'answerPermission', requestID: ask.id, answer: 'answers', answers })) {
            submit.disabled = true;
          }
        });
        const readySubmit = () => {
          submit.disabled = !ask.questions.every(question => answerFor(question));
        };

        const parts = [];
        for (const question of ask.questions) {
          if (!answerState.has(question.text)) {
            answerState.set(question.text, { choices: new Set(), other: '' });
          }
          const saved = answerState.get(question.text);
          const options = element('div', 'options');
          const other = element('input', 'other');
          const paint = () => {
            for (const node of options.children) {
              node.classList.toggle('chosen', saved.choices.has(node.dataset.label));
            }
            readySubmit();
          };
          for (const option of question.options) {
            const choice = button('option', option.label, () => {
              saved.other = '';
              other.value = '';
              if (question.multiSelect) {
                if (saved.choices.has(option.label)) saved.choices.delete(option.label);
                else saved.choices.add(option.label);
              } else {
                const already = saved.choices.has(option.label);
                saved.choices.clear();
                if (!already) saved.choices.add(option.label);
              }
              paint();
            });
            choice.dataset.label = option.label;
            if (option.description) {
              choice.append(element('span', 'option-description', option.description));
            }
            options.append(choice);
          }
          other.placeholder = 'Something else…';
          other.value = saved.other;
          other.addEventListener('input', () => {
            saved.other = other.value;
            if (other.value) saved.choices.clear();
            paint();
          });
          parts.push(element('div', 'question-text', question.text), options, other);
          paint();
        }

        const buttons = element('div', 'buttons');
        buttons.append(button('deny', 'Skip', () =>
          send({ type: 'answerPermission', requestID: ask.id, answer: 'deny' })));
        buttons.append(submit);
        parts.push(buttons);
        return parts;
      };

      const permissionBody = () => {
        const parts = [];
        parts.push(element('div', 'lead', ask.lead));
        if (ask.detail) parts.push(element('p', 'detail', ask.detail));
        if (ask.subject) parts.push(element('pre', 'subject', ask.subject));
        if (ask.runsIn) parts.push(element('div', 'runs-in', `RUNS IN ${ask.runsIn}`));

        const buttons = element('div', 'buttons');
        buttons.append(button('deny', 'Deny', () => {
          denying = true;
          drawSheet();
        }));
        buttons.append(button('allow', 'Allow once', () =>
          send({ type: 'answerPermission', requestID: ask.id, answer: 'allowOnce' })));
        parts.push(buttons);
        if (ask.alwaysTitle) {
          parts.push(button('always', ask.alwaysTitle, () =>
            send({ type: 'answerPermission', requestID: ask.id, answer: 'allowAlways' })));
        }
        return parts;
      };

      const denyBody = () => {
        const reason = element('div', 'reason');
        const field = element('textarea');
        field.placeholder = 'Tell the agent why…';
        field.maxLength = 100000;
        field.setAttribute('aria-label', 'Why this is denied');
        const submit = button('', '↑', () => {
          if (send({ type: 'answerPermission', requestID: ask.id, answer: 'deny',
                     prompt: field.value.trim() })) {
            submit.disabled = true;
          }
        });
        submit.setAttribute('aria-label', 'Send the denial');
        reason.append(field, submit);
        queueMicrotask(() => field.focus());
        return [element('div', 'lead', 'Why not?'), reason];
      };

      const drawSheet = () => {
        sheet?.remove();
        sheet = undefined;
        // The new-session sheet owns the scrim while it is up, so the ask leaves it alone.
        if (!newSheet) {
          scrim?.remove();
          scrim = undefined;
        }
        document.body.classList.toggle('asking', !!ask && !collapsed);
        bar.hidden = !ask || !collapsed;
        if (!ask || newSheet) return;

        const label = ask.kind === 'question' ? 'QUESTION'
                                              : `PERMISSION · ${ask.toolName.toUpperCase()}`;
        if (collapsed) {
          bar.replaceChildren(element('span', 'kind-dot'), element('span', '', label),
                              element('span', 'strip-gap'), element('span', 'open', 'OPEN'));
          return;
        }

        scrim = element('div', '');
        scrim.id = 'scrim';
        scrim.addEventListener('click', () => collapse(true));
        document.body.append(scrim);

        sheet = element('div', 'sheet');
        sheet.id = 'sheet';
        sheet.setAttribute('role', 'dialog');
        const handle = element('div', 'handle');
        sheet.append(handle);
        const kind = element('div', 'kind');
        kind.append(element('span', 'kind-dot'), element('span', 'kind-label', label));
        sheet.append(kind);
        const body = denying ? denyBody() : ask.kind === 'question' ? questionBody() : permissionBody();
        sheet.append(...body);
        document.body.append(sheet);
        dragToDismiss(handle, () => collapse(true), sheet);
      };

      const renderAsk = request => {
        if (!request) {
          ask = undefined;
          collapsed = false;
          denying = false;
          answerState.clear();
          drawSheet();
          return;
        }
        if (ask?.id !== request.id) {
          collapsed = false;
          denying = false;
          answerState.clear();
        }
        ask = request;
        drawSheet();
      };

      const collapse = value => {
        if (!ask || collapsed === value) return;
        collapsed = value;
        drawSheet();
      };

      // Pulling the handle down puts a sheet away, which is the gesture the shape of a
      // sheet already promises.
      const dragToDismiss = (handle, dismiss, panel) => {
        let start;
        const moving = () => panel || newSheet;
        handle.addEventListener('pointerdown', event => {
          start = event.clientY;
          handle.setPointerCapture(event.pointerId);
        });
        handle.addEventListener('pointermove', event => {
          if (start === undefined) return;
          const travelled = event.clientY - start;
          if (travelled > 40) {
            start = undefined;
            if (moving()) moving().style.transform = '';
            dismiss();
          } else if (travelled > 0 && moving()) {
            moving().style.transform = `translateY(${travelled}px)`;
          }
        });
        const settle = () => {
          start = undefined;
          if (moving()) moving().style.transform = '';
        };
        handle.addEventListener('pointerup', settle);
        handle.addEventListener('pointercancel', settle);
      };

      // MARK: - Connection

      const connect = () => {
        clearTimeout(reconnectTimer);
        if (!secret) {
          show('session');
          title.textContent = 'Pairing code missing';
          state.textContent = 'SCAN THE QR CODE AGAIN';
          showError('The pairing code is missing. Scan the QR code again.');
          return;
        }
        const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
        socket = new WebSocket(`${scheme}://${location.host}/socket/${pairingID}`);
        socket.addEventListener('open', () => {
          setConnected(true);
          socket.send(JSON.stringify({ type: 'authenticate', version: 1, secret }));
        });
        socket.addEventListener('message', event => {
          try {
            const payload = JSON.parse(event.data);
            if (payload.type === 'snapshot') applySnapshot(payload);
            else if (payload.type === 'update') applyUpdate(payload);
            else if (payload.type === 'directory') renderDirectory(payload);
            else if (payload.type === 'error') {
              // A refused start leaves the sheet up, so the reason can be read and the
              // same tap tried again.
              if (creating) {
                creating = false;
                if (newSheet) drawNewSheet();
              }
              showError(payload.message);
            }
          } catch (_) {
            showError('The Mac sent an unreadable update.');
          }
        });
        socket.addEventListener('close', () => {
          setConnected(false);
          state.textContent = 'RECONNECTING';
          state.className = 'quiet';
          listWhere.textContent = 'RECONNECTING';
          reconnectTimer = setTimeout(connect, 1500);
        });
        socket.addEventListener('error', () => socket.close());
      };

      composer.addEventListener('submit', event => {
        event.preventDefault();
        const text = prompt.value.trim();
        if (!text) return;
        if (send({ type: 'sendPrompt', prompt: text })) {
          prompt.value = '';
          prompt.style.height = '';
        }
      });
      prompt.addEventListener('input', () => {
        prompt.style.height = 'auto';
        prompt.style.height = `${Math.min(prompt.scrollHeight, 140)}px`;
      });
      stop.addEventListener('click', () => send({ type: 'stopTurn' }));
      back.addEventListener('click', () => {
        renderAsk(undefined);
        send({ type: 'closeSession' });
      });
      bar.addEventListener('click', () => collapse(false));
      setInterval(renderElapsed, 15000);
      setConnected(false);
      show('directory');
      connect();
    })();
  </script>
</body>
</html>
